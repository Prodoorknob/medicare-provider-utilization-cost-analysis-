<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fraud Detection Agent · Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #E8E6E1; height: 100%; }
  * { box-sizing: border-box; }
  #root { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="onepager.jsx"></script>
<script type="text/babel" src="summary-card.jsx"></script>
<script type="text/babel" src="swipedeck.jsx"></script>

<script type="text/babel">
  function UsageNote() {
    return (
      <div style={{
        padding: '28px 32px', background: '#fff', border: '1px solid rgba(0,0,0,0.08)',
        borderRadius: 12, fontFamily: 'Inter, system-ui, sans-serif',
        color: '#1C1917', lineHeight: 1.5, fontSize: 15,
      }}>
        <div style={{
          fontFamily: '"IBM Plex Mono", monospace', fontSize: 11, fontWeight: 700,
          letterSpacing: '0.22em', textTransform: 'uppercase', color: '#0F6E8C',
          marginBottom: 12,
        }}>How to use these</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 28 }}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 6 }}>① Summary card (1200×1600)</div>
            <div style={{ color: '#57534E' }}>
              A single screenshot. Right-click the artboard → "Save image"
              or use your OS screenshot tool. Post directly to LinkedIn / X
              with a short caption + link to the live demo.
            </div>
          </div>
          <div>
            <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 6 }}>② Long-form explainer (1280×~4800)</div>
            <div style={{ color: '#57534E' }}>
              A scrollable web page, not meant to be screenshotted whole.
              Host this HTML file at a URL (GitHub Pages, Vercel, your site)
              and link to it. Readers scroll through like a blog post.
            </div>
          </div>
          <div>
            <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 6 }}>③ LinkedIn carousel (8 × 1080²)</div>
            <div style={{ color: '#57534E' }}>
              Eight square panels. Screenshot each panel one at a time
              (or export as PDF pages), then upload all 8 to a LinkedIn
              "document / carousel" post. Viewers swipe through them.
            </div>
          </div>
        </div>
      </div>
    );
  }

  function App() {
    return (
      <DesignCanvas title="Fraud Detection Agent · Explainer">
        <DCSection id="howto" title="How to share each artifact">
          <DCArtboard id="howto-v1" label="Usage guide" width={1400} height={260}>
            <UsageNote/>
          </DCArtboard>
        </DCSection>
        <DCSection id="summary" title="① One-screen summary card" subtitle="Single screenshot · drop on LinkedIn / X with a caption">
          <DCArtboard id="summary-v1" label="Summary card · 1200×1600" width={1200} height={1600}>
            <SummaryCard/>
          </DCArtboard>
        </DCSection>
        <DCSection id="onepager" title="② Long-form explainer page" subtitle="Scrollable web page · host at a URL and link to it">
          <DCArtboard id="onepager-v1" label="Long-form page · ~1280×5500" width={1280} height={5500}>
            <OnePager/>
          </DCArtboard>
        </DCSection>
        <DCSection id="swipedeck" title="③ LinkedIn carousel" subtitle="9 square panels · upload as a document / carousel post">
          <DCArtboard id="swipedeck-v1" label="Swipe-deck · 9 panels" width={1080} height={10000}>
            <SwipeDeck/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
