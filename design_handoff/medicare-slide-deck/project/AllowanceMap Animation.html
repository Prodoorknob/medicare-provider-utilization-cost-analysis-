<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AllowanceMap · Medicare Prediction — Animated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; height: 100%; overflow: hidden; }
  * { box-sizing: border-box; }
  #root { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="anim-scenes-1.jsx"></script>
<script type="text/babel" src="anim-scenes-2.jsx"></script>
<script type="text/babel" src="anim-scenes-3.jsx"></script>

<script type="text/babel">
  // Scene timing (seconds) — fast-paced
  const SCENES = [
    { start:  0.0, end:  3.2, Comp: SceneOpen,     chrome: false },
    { start:  3.2, end:  9.2, Comp: SceneProblem,  chrome: true  },
    { start:  9.2, end: 15.6, Comp: SceneData,     chrome: true  },
    { start: 15.6, end: 22.6, Comp: ScenePipeline, chrome: true  },
    { start: 22.6, end: 30.2, Comp: SceneModelZoo, chrome: true  },
    { start: 30.2, end: 36.8, Comp: SceneBug,      chrome: true  },
    { start: 36.8, end: 43.6, Comp: SceneResults,  chrome: true  },
    { start: 43.6, end: 50.0, Comp: SceneProduct,  chrome: false },
  ];
  const TOTAL = SCENES[SCENES.length - 1].end;

  function ChromeSprite() {
    const t = useTime();
    // Show chrome except during open + product scenes
    const show = SCENES.some(s => s.chrome && t >= s.start && t < s.end);
    if (!show) return null;
    return <Chrome/>;
  }

  function SceneProgress() {
    const t = useTime();
    return (
      <div style={{
        position:'absolute', top: 56, left: 0, right: 0, height: 3,
        display: 'flex', gap: 4, padding: '0 40px', zIndex: 40,
      }}>
        {SCENES.map((s, i) => {
          const p = Math.max(0, Math.min(1, (t - s.start) / (s.end - s.start)));
          return (
            <div key={i} style={{ flex: 1, height: 2, background: 'rgba(0,0,0,0.08)' }}>
              <div style={{
                width: `${p * 100}%`, height: '100%',
                background: p >= 1 ? AC.green : AC.teal,
                transition: 'width 60ms linear',
              }}/>
            </div>
          );
        })}
      </div>
    );
  }

  function App() {
    return (
      <Stage width={1920} height={1080} duration={TOTAL}
             background={AC.bg} persistKey="allowancemap-anim">
        {SCENES.map((s, i) => (
          <Sprite key={i} start={s.start} end={s.end}>
            <s.Comp/>
          </Sprite>
        ))}
        <ChromeSprite/>
        <SceneProgress/>
      </Stage>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
