<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AllowanceMap · Medicare Provider Cost Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  * { box-sizing: border-box; }
  section { font-family: 'Inter', system-ui, sans-serif; color: #1C1917; background: #FAFAF8; }
</style>
<script src="deck-stage.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<deck-stage id="deck" width="1920" height="1080"></deck-stage>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="slides.jsx"></script>
<script type="text/babel">
  // Render each slide as a direct child <section> of <deck-stage>
  const deck = document.getElementById('deck');
  // Render the <Deck/> tree into a staging div, then move each child into deck-stage.
  const staging = document.createElement('div');
  ReactDOM.createRoot(staging).render(<Deck/>);
  // Wait a tick for React to mount, then migrate.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      // React renders top-level fragments as direct children of staging.
      while (staging.firstChild) {
        const el = staging.firstChild;
        // wrap each slide div into a <section>
        const sec = document.createElement('section');
        sec.appendChild(el);
        deck.appendChild(sec);
      }
    });
  });
</script>
</body>
</html>
